[package]
name = "open-scrantic"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Reverse-engineered, behavior-faithful reimplementation of Sierra/Dynamix 'Screen Antics: Johnny Castaway' (1993), running on the original data files"
license = "MIT"
publish = false

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
softbuffer = "0.4.8"
winit = "0.30.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Zero-warning policy: any compiler or clippy warning fails the build.
[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
